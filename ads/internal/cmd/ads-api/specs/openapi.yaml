openapi: "3.0.3"

info:
  title: Ads API
  description: Classified ads — list, read, create, import and delete ads.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [infra]
      responses:
        "200":
          description: Service is up

  /ads:
    get:
      summary: List ads
      operationId: listAds
      tags: [ads]
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on the ad title.
          schema:
            type: string
          example: bike
        - name: user_id
          in: query
          description: Filter ads belonging to this owner.
          schema:
            type: string
          example: "00000000-0000-0000-0000-000000000001"
        - name: min_price_cents
          in: query
          description: Inclusive lower bound on the price (in cents). 0 means no lower bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 5000
        - name: max_price_cents
          in: query
          description: Inclusive upper bound on the price (in cents). 0 means no upper bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 50000
      responses:
        "200":
          description: List of matching ads (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdsResponse"
        "400":
          description: Invalid query parameter (e.g. non-numeric price).

    post:
      summary: Create an ad
      operationId: createAd
      tags: [ads]
      security:
        - userID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: Ad created. The body contains the generated identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Malformed or unknown request body field, invalid price (more than 2 decimals), or both `price` and `price_cents` sent.
        "401":
          description: Missing Authorization header.
        "500":
          description: Unexpected server error.

  /ads/import:
    post:
      summary: Import ads in bulk
      description: The import is atomic, either every ad is created or none is. Send an `Idempotency-Key` header to retry safely.
      operationId: importAds
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique key of this import for the caller (e.g. a UUID), at most 255 characters. Retrying with the same key returns the identifiers of the first import without creating anything. Strongly recommended, since a retry without key may create duplicates.
          schema:
            type: string
            maxLength: 255
          example: "7f9c2ba4-e88f-4f1a-9a3c-3b1d2a6e5c10"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAdsBody"
      responses:
        "201":
          description: Ads created. The body contains the generated identifiers, in the order of the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAdsResponse"
        "400":
          description: Malformed body, invalid price on any item, or idempotency key longer than 255 characters (nothing is created).
        "401":
          description: Missing Authorization header.
        "500":
          description: Unexpected server error.
  
  /ads/{adID}:
    get:
      summary: Get an ad by ID
      operationId: getAd
      tags: [ads]
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: The requested ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDetails"
        "400":
          description: adID is not a valid integer.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.
    
    delete:
      summary: Delete an ad
      operationId: deleteAd
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "204":
          description: Ad deleted.
        "400":
          description: adID is not a valid integer.
        "401":
          description: Missing Authorization header.
        "404":
          description: No ad exists with this ID, or it is owned by another user. Both cases answer 404 so the existence of other users' ads is not disclosed.
        "500":
          description: Unexpected server error.

components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: Authorization
      description: The caller's user ID. No token validation is performed — the value is used as-is as the owner identifier.

  schemas:
    Ad:
      type: object
      required: [id, title, price_cents, price, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price_cents:
          type: integer
          format: int64
          deprecated: true
          description: Price in euro cents. Deprecated, use `price`. Kept so existing clients keep working.
          example: 15000
        price:
          type: number
          format: double
          description: Price in euros, with at most 2 decimals. Prices are stored in integer cents; clients should not do monetary arithmetic on this value.
          example: 150
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    ListAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"

    CreateAdBody:
      type: object
      description: Send the price either as `price` (preferred) or as the deprecated `price_cents`, not both.
      required: [title, photo_url]
      properties:
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: double
          description: Price in euros, with at most 2 decimals. More decimals are rejected (400) rather than rounded.
          example: 150
        price_cents:
          type: integer
          format: int64
          deprecated: true
          description: Price in euro cents. Deprecated, use `price`.
          example: 15000
        photo_url:
          type: string
          example: https://example.com/bike.jpg

    CreateAdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: Generated identifier of the new ad.
          example: 42
    
    AdDetails:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          required: [username]
          properties:
            username:
              type: string
              nullable: true
              description: Nickname of the ad owner, from the identity service. null when the identity service cannot provide it; the ad is still returned.
              example: alice

    ImportAdsBody:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/CreateAdBody"

    ImportAdsResponse:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [42, 43]
